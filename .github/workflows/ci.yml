name: CI (Quality, Build & Docs)

on:
  push:

  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Fast checks and unit tests
  check-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check lockfile integrity
        run: uv lock --check

      - name: Install all dependencies
        run: uv sync --all-groups --all-packages

      - name: Lint with Ruff
        run: uv run ruff check . --output-format=github

      - name: Type check with MyPy
        run: uv run mypy .

      - name: Unit tests with Pytest
        run: uv run pytest

  # JOB 2: Docker build test for each app in the matrix
  docker-build-test:
    needs: check-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # LIST ALL YOUR APPS HERE - expand this as you add new apps
        app_name: [template_app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build for ${{ matrix.app_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app_name }}/Dockerfile
          push: false
          build-args: |
            PACKAGE_NAME=${{ matrix.app_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3: Documentation build
  build-docs:
    needs: check-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build Sphinx HTML
        run: |
          uv sync --all-groups --all-packages
          uv run sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Store Documentation
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: docs/build/html
