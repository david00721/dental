[project]
name = "dental"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "template-app",
]

[tool.uv.workspace]
members = [
    "apps/template_app",
]

[tool.uv.sources]
template-app = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["venv", ".venv", ".*/tests/.*"]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
